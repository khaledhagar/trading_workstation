[project]
name = "trading-workstation-backend"
version = "0.1.0"
description = "FastAPI backend for trading_workstation: market data, portfolio, LLM chat"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",          # Massive client + FastAPI test client
    "python-dotenv>=1.0",   # PLAN.md §5
    "tzdata>=2024.1",       # zoneinfo("America/New_York") on Windows / slim images
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
