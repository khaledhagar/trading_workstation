# E2E run: docker compose -f test/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from e2e
services:
  workstation:  # not "app": Chrome forces HTTPS for the .app TLD
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      LLM_MOCK: "true"
      MASSIVE_API_KEY: ""
      OPENROUTER_API_KEY: ""
    # No volume: every run starts from a fresh, seeded database.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /e2e
    depends_on:
      workstation:
        condition: service_healthy
    environment:
      BASE_URL: http://workstation:8000
      CI: "true"
    volumes:
      - ./:/e2e
      - /e2e/node_modules
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"
